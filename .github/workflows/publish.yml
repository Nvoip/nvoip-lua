name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to LuaRocks after validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  luarocks:
    name: Publish to LuaRocks
    runs-on:
      - codebuild-nvoip-ci-public-release-${{ github.run_id }}-${{ github.run_attempt }}
      - organization-registration-name:Nvoip
      - registration-group-id:4
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks make --local
      - if: github.event_name == 'release' || inputs.publish
        run: luarocks upload *.rockspec --api-key="$LUAROCKS_API_KEY"
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
