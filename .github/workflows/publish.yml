name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to LuaRocks after validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  luarocks:
    name: Publish to LuaRocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@8aace3457a2fcf3f3c4e9007ecc6b869ff6d74d6 # v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@4c082a5fad45388feaeb0798dbd82dbd7dc65bca # v5
        with:
          luaRocksVersion: "3.13.0"
      - run: luarocks make --local
      - if: github.event_name == 'release' || inputs.publish
        run: luarocks upload *.rockspec --api-key="$LUAROCKS_API_KEY"
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
