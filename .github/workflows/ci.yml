name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leafo/gh-actions-lua@8aace3457a2fcf3f3c4e9007ecc6b869ff6d74d6 # v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@4c082a5fad45388feaeb0798dbd82dbd7dc65bca # v5
        with:
          luaRocksVersion: "3.13.0"
      - run: lua -e "assert(loadfile('nvoip.lua'))"
      - run: for file in examples/*.lua; do lua -e "assert(loadfile('$file'))"; done
      - run: lua tests/transport.lua
